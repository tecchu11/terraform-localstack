services:
  floci:
    image: floci/floci:2.0.1
    ports:
      - "4566:4566"
    environment:
      - FLOCI_DEFAULT_REGION=ap-northeast-1
      - FLOCI_STORAGE_MODE=persistent
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - "floci-data:/app/data"
      - "./docker/floci/init/ready:/etc/floci/init/ready.d"
      - "/var/run/docker.sock:/var/run/docker.sock"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4566/_floci/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  floci-data:
